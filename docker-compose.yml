version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: axiom_qdrant
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC interface
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: axiom_redis
    ports:
      - "6379:6379" # Redis port for BullMQ background ingestion queue
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
